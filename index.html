<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nana 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: #000;
  overflow: hidden;
  background: linear-gradient(135deg, #ff69b4, #ffc0cb);
}

/* floating emoji background */
body::before {
  content: "🎉 🎂 🎈 🎊 🎁 🎉 🎂 🎈 🎊 🎁";
  position: fixed;
  top: 0;
  left: 0;
  width: 200%;
  height: 200%;
  font-size: 40px;
  opacity: 0.08;
  line-height: 3em;
  word-spacing: 40px;
  transform: rotate(-20deg);
  pointer-events: none;
  animation: floatBg 20s linear infinite;
}

@keyframes floatBg {
  from { transform: translateY(0) rotate(-20deg); }
  to { transform: translateY(-50%) rotate(-20deg); }
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  padding: 25px;
  width: 90%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 25px;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  z-index: 2;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, -40%); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}

h1 { 
  font-size: 2.2rem; 
  animation: popIn 1s ease;
}

@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.message-box {
  margin-top: 15px;
  background: rgba(255,255,255,0.25);
  padding: 15px;
  border-radius: 15px;
  min-height: 60px;
}

button {
  margin-top: 18px;
  border-radius: 30px;
  padding: 12px 20px;
  background: white;
  color: #ff4e8a;
  font-weight: bold;
  cursor: pointer;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  visibility: hidden;
  opacity: 0;
  transition: 0.3s;
  z-index: 3;
}

.popup.show {
  visibility: visible;
  opacity: 1;
}

.popup-content {
  text-align: center;
  color: white;
  animation: scaleUp 0.5s ease;
}

@keyframes scaleUp {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>



<canvas id="snow"></canvas>

<div class="container">
  <h1>🎂 Happy Birthday Nana 🎉</h1>
  <div class="message-box" id="typingText"></div>
  <button onclick="startSurprise()">Click Here 🎁</button>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <h2>🎉 Surprise 🎉</h2>
    <p id="popupText"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>
// typing animation
const message = "Wishing you a happy and wonderful day, Nana… you deserve all the love and happiness 😊✨";
let i = 0;

function typeEffect() {
  if (i < message.length) {
    document.getElementById("typingText").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeEffect, 30);
  }
}

// popup typing
const popupMsg = "You're an amazing person, Nana 🌸 Stay happy always 😊";
let j = 0;

function typePopup() {
  const el = document.getElementById("popupText");
  el.innerHTML = "";
  j = 0;
  function typing() {
    if (j < popupMsg.length) {
      el.innerHTML += popupMsg.charAt(j);
      j++;
      setTimeout(typing, 30);
    }
  }
  typing();
}

// confetti system
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const emojis = ["🎉","🎂","🎈","🎊","🎁"];
let snowParticles = [];
let burstParticles = [];

function createSnow() {
  for (let i = 0; i < 80; i++) {
    snowParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: Math.random() * 2 + 1,
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
      size: Math.random() * 20 + 20
    });
  }
}

function createBurst() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  for (let i = 0; i < 200; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 10 + 4;

    burstParticles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
      size: Math.random() * 26 + 16,
      life: 120
    });
  }
}

function playSound() {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const notes = [523, 659, 784]; // C, E, G (happy tone)

  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + i * 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.5);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(audioCtx.currentTime + i * 0.1);
    osc.stop(audioCtx.currentTime + i * 0.1 + 0.5);
  });
}

function startSurprise() {
  
  burstParticles = [];
  createBurst();
  playSound();
  document.getElementById("popup").classList.add("show");
  typePopup();
}

function closePopup() {
  document.getElementById("popup").classList.remove("show");
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  snowParticles.forEach(p => {
    ctx.font = p.size + "px serif";
    ctx.fillText(p.emoji, p.x, p.y);
  });

  burstParticles.forEach(p => {
    ctx.font = p.size + "px serif";
    ctx.fillText(p.emoji, p.x, p.y);
  });

  update();
}

function update() {
  snowParticles.forEach(p => {
    p.y += p.speed;
    if (p.y > canvas.height) p.y = -20;
  });

  burstParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life--;
  });

  burstParticles = burstParticles.filter(p => p.life > 0);
}

function animate() {
  draw();
  requestAnimationFrame(animate);
}

createSnow();
animate();
typeEffect();
</script>

</body>
</html>
